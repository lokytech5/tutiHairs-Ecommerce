services:
  db:
    image: mongo:4
    container_name: tutihair_db
    restart: always
    volumes:
      - ./tutiEcommerceDB:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: admin
    mem_limit: 600m
    cpus: 0.7
    networks:
      - app-network

  backend:
    build: .
    container_name: tutihair_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      - db
    mem_limit: 500m
    cpus: 0.6
    networks:
      - app-network

networks:
  app-network:
    external: true
